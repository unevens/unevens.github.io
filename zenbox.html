<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="description" content="Simulation Playground" />
  <meta name="author" content="Dario Mambro" />
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="icon" type="image/png" href="img/favicon.png" />
  <title>ZenBox - unevens.net</title>

  <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
  <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css" />
  <link
    href="https://fonts.googleapis.com/css?family=Open+Sans:300italic,400italic,600italic,700italic,800italic,400,300,600,700,800&display=swap"
    rel="stylesheet" type="text/css" />
  <link
    href="https://fonts.googleapis.com/css?family=Merriweather:400,300,300italic,400italic,700,700italic,900,900italic&display=swap"
    rel="stylesheet" type="text/css" />
  <link href="css/style.min.css" rel="stylesheet" />
</head>

<body id="page-top">
  <canvas id="canvas" class="home-canvas"></canvas>

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-light fixed-top" id="mainNav">
    <div class="container">
      <a class="navbar-brand js-scroll-trigger" href="index.html">unevens</a>
      <button class="navbar-toggler navbar-toggler-right" type="button" data-toggle="collapse"
        data-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false"
        aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarResponsive">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item">
            <a class="nav-link js-scroll-trigger" href="zenbox.html">ZenBox</a>
          </li>
          <li class="nav-item">
            <a class="nav-link js-scroll-trigger" href="audio.html">Audio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link js-scroll-trigger" href="music.html">Music</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div id="ctrls" hidden>
    <div id="global-params"></div>
    <div id="layer-controls">
      <div class="layer-controls__row">
        <select id="layer-select"></select>
        <button class="layer-controls__btn" id="add-layer" title="Add layer"><i class="fas fa-plus"></i></button>
        <button class="layer-controls__btn" id="remove-layer" title="Remove layer"><i class="fas fa-minus"></i></button>
        <button class="layer-controls__btn" id="undo-edit" title="Undo (Ctrl+Z)"><i class="fas fa-undo"></i></button>
      </div>
    </div>
    <div id="params"></div>

    <div id="saveload">
      <button id="loadSceneBtn">
        <i class="fas fa-folder-open"></i> Load Scene
      </button>
      <input type="file" id="loadScene" />
      <button id="saveScene">
        <i class="fas fa-save"></i> Save Scene
      </button>
      <button id="loadParamsBtn">
        <i class="fas fa-folder-open"></i> Load
      </button>
      <input type="file" id="loadParams" />
      <button id="saveParams">
        <i class="fas fa-save"></i> Save
      </button>
    </div>

    <div id="fps" hidden></div>
  </div>

  <div class="bottom-bar">
    <div class="text_home_cpy">Copyright &copy; Dario Mambro 2023-2026</div>
    <div class="ui-head">
      <i id="refresh" class="ctrls-toggle fas fa-sync fa-2x"></i>
      <span>ZenBox Theme</span>
      <select id="zenbox-theme"></select>
      <i id="ctrls-edit-toggle" class="ctrls-toggle fas fa-edit fa-2x"></i>
    </div>
  </div>

  <!-- Bootstrap core JavaScript -->
  <script src="vendor/jquery/jquery.min.js"></script>
  <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

  <!-- Plugin JavaScript -->

  <script type="module">
    import { createParticleScene } from "./gl/particles.js";

    document.getElementById('loadSceneBtn').addEventListener('click', () => {
      document.getElementById('loadScene').click();
    });
    document.getElementById('loadParamsBtn').addEventListener('click', () => {
      document.getElementById('loadParams').click();
    });
    document.getElementById('ctrls-edit-toggle').addEventListener('click', () => {
      const ctrls = document.getElementById('ctrls');
      ctrls.hidden = !ctrls.hidden;
    });

    const scene = createParticleScene("holy");
    scene.start();
  </script>
</body>

</html>
